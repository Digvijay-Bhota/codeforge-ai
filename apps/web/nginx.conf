# Review console server for the local Compose stack (apps/web/Dockerfile).
# Serves the built app, forwards /api/ to the API on the Compose network (same
# origin, so no CORS), and falls back to index.html for client-side routes.

# Access log without query strings or referrers.  The OAuth callback
# (/auth/callback, then /api/v1/auth/github/callback) carries the authorization
# code and state in its query string, and nginx's default format logs the whole
# request line.  nginx cannot drop single arguments, so the requested path is
# logged followed by "?" when a query string was present.  Both come from
# $request_uri (as sent, before try_files rewrites $uri to /index.html).
# nginx's error log still quotes the full request line when proxying fails; see
# docs/security/oauth-logging.md.
# (This file is included in the http context, where map and log_format belong.)
map $request_uri $codeforge_request_path {
    "~^(?<path>[^?]*)(?<query_mark>\??)" $path$query_mark;
}
log_format codeforge_noquery '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $codeforge_request_path $server_protocol" '
                             '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /var/log/nginx/access.log codeforge_noquery;
    client_max_body_size 1m;

    # Every response, including errors and proxied API responses.  The policy
    # is the app's own (CONTENT_SECURITY_POLICY in vite.config.ts, also in the
    # built index.html) plus frame-ancestors, which only a header can carry.
    # src/test/nginx.test.ts keeps the two in step.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Re-resolved through Docker's DNS, so an API restart (new address) is
    # followed.  With a variable and no URI part, the request URI is passed
    # through unchanged (/api/v1/...).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change; a missing one is a 404, not the app.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
