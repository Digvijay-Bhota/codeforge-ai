name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Build, Lint, Type-check, Test, Migrate
    runs-on: ubuntu-latest

    # We can spin up postgres and redis as service containers to safely test migrations and integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codeforge
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt bandit pip-audit

      - name: Run Ruff (lint)
        run: ruff check apps/api/app apps/api/tests

      - name: Run mypy (type-check)
        run: mypy apps/api/app

      - name: Run Alembic Migration Checks
        env:
          DATABASE_URL: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
        run: |
          cd apps/api
          alembic upgrade head

      - name: Run pytest
        run: pytest apps/api/tests
        env:
          DATABASE_URL: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
          REDIS_URL: redis://localhost:6379/0

      - name: Run Security Checks
        run: |
          bandit -r apps/api/app
          pip-audit -r apps/api/requirements.txt || true # Ignore pip-audit failures for phase 9 scope

      - name: Verify Docker Build
        run: docker compose build
