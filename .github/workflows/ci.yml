name: CI

on:
  push:
    branches: ["main", "develop", "feature/phase-10b5-stage1d-*"]
  pull_request:
    # fix/integration-test-findings: base of a stacked pull request (#27) until
    # #26 is merged.  Such runs get suffixed check names (see the job name), so
    # they cannot stand in for main's required checks.
    branches: ["main", "develop", "feature/phase-10b5-stage1d-*", "fix/integration-test-findings"]

jobs:
  test:
    # The unsuffixed name is a required check on main: only pull requests into
    # main may report it.  Pushes and pull requests into other branches get a
    # suffixed name, so they cannot stand in for it on the same commit.
    name: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') && 'Build, Lint, Type-check, Test, Migrate' || format('Build, Lint, Type-check, Test, Migrate ({0} validation{1})', github.event_name, github.base_ref && format(' into {0}', github.base_ref) || '') }}
    runs-on: ubuntu-latest

    # We can spin up postgres and redis as service containers to safely test migrations and integration tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codeforge
          POSTGRES_USER: codeforge
          POSTGRES_PASSWORD: codeforge
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt bandit pip-audit

      - name: Run Ruff (lint)
        run: ruff check apps/api/app apps/api/tests infra/scripts

      - name: Run mypy (type-check)
        run: |
          mypy apps/api/app
          mypy --strict infra/scripts/docker_data_preflight.py

      - name: Run Alembic Migration Checks
        env:
          # alembic/env.py loads app.config, which refuses the public default
          # JWT secret unless APP_ENV is explicitly development or test.
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
        run: |
          cd apps/api
          alembic upgrade head

      - name: Build Docker test executor image
        run: |
          docker build -t codeforge-test-runner:ci sandbox/docker
          echo "CODEFORGE_IT_DOCKER_IMAGE=$(docker image inspect --format '{{.Id}}' codeforge-test-runner:ci)" >> "$GITHUB_ENV"

      - name: Run the hermetic end-to-end workflow test
        # Issue comment -> webhook -> plan -> approval -> EXECUTION_UNAVAILABLE,
        # with GitHub and OpenAI replaced at their HTTP boundaries (no secrets,
        # no network).  See apps/api/tests/e2e/test_comment_to_approval.py.
        run: pytest apps/api/tests/e2e -rs
        env:
          DATABASE_URL: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
          REDIS_URL: redis://localhost:6379/0

      - name: Run pytest
        run: pytest apps/api/tests -rs --ignore=apps/api/tests/e2e
        env:
          DATABASE_URL: postgresql+asyncpg://codeforge:codeforge@localhost:5432/codeforge
          REDIS_URL: redis://localhost:6379/0
          # Real-Docker executor tests must run here, not skip.
          CODEFORGE_IT_DOCKER_REQUIRED: "1"

      - name: Run Security Checks
        run: |
          bandit -r apps/api/app infra/scripts
          pip-audit -r apps/api/requirements.txt || true # Ignore pip-audit failures for phase 9 scope

      - name: Verify Docker Build
        run: docker compose build

      - name: Verify the worker image provides git
        # The worker clones repositories with git (apps/api/app/github/git.py).
        # Runs as the image's own non-root user, with no network.
        run: |
          image=$(docker compose config --format json | python3 -c 'import json, sys; c = json.load(sys.stdin); print(c["services"]["worker"].get("image") or c["name"] + "-worker")')
          docker run --rm --network none --entrypoint sh "$image" -c 'test "$(id -un)" = codeforge && git --version'
