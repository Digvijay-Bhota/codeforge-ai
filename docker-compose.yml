# LOCAL DEVELOPMENT ONLY - not a production deployment configuration.
#
# Requires POSTGRES_PASSWORD and REDIS_PASSWORD (for example in a gitignored
# .env next to this file); compose-guard refuses to start the stack without
# strong values.  See docs/deployment.md ("Local development with Docker
# Compose").  PostgreSQL and Redis are reachable only on the internal Compose
# network; the API (127.0.0.1:8000) and the review console (web,
# 127.0.0.1:3000, which forwards /api/ to the API) only on loopback.  For local
# debugging access to the database and Redis, add docker-compose.dev-ports.yml
# (also loopback-only).
# These defaults limit network exposure; they do not make the stack
# production-ready (APP_ENV=development still accepts the public JWT secret).

x-app-environment: &app-environment
  APP_NAME: CodeForge AI
  APP_ENV: development
  LOG_LEVEL: INFO
  DATABASE_URL: postgresql+asyncpg://codeforge:${POSTGRES_PASSWORD:-}@postgres:5432/codeforge
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0

services:
  # Validates the required credentials before PostgreSQL and Redis start.  The
  # values are interpolated with ${VAR:-} rather than ${VAR:?} so that commands
  # that never start the stack (docker compose build/config) keep working.
  compose-guard:
    image: redis:7-alpine
    entrypoint: ["sh", "-c"]
    command:
    - |
      # Enforces: set; at least 32 characters; URL-safe characters only; at
      # least 8 distinct characters; no placeholder word (any letter case).
      # It cannot prove a value is random - generate it as documented.
      fail=0
      check() {
        name=$$1
        value=$$2
        if [ -z "$$value" ]; then
          echo "compose-guard: $$name is not set. Generate one with:" >&2
          echo "  python -c 'import secrets; print(secrets.token_urlsafe(32))'" >&2
          echo "and set it in .env (see docs/deployment.md)." >&2
          fail=1
          return
        fi
        if [ "$${#value}" -lt 32 ]; then
          echo "compose-guard: $$name must be at least 32 characters." >&2
          fail=1
        fi
        case "$$value" in
          *[!A-Za-z0-9._~-]*)
            echo "compose-guard: $$name may only contain A-Z a-z 0-9 . _ ~ - (it is embedded in connection URLs)." >&2
            fail=1 ;;
        esac
        if [ "$$(printf '%s' "$$value" | fold -w1 | sort -u | wc -l)" -lt 8 ]; then
          echo "compose-guard: $$name is too repetitive; generate a random value." >&2
          fail=1
        fi
        case "$$(printf '%s' "$$value" | tr 'A-Z' 'a-z')" in
          *codeforge*|*password*|*passwd*|*changeme*|*change-me*|*change_me*|*placeholder*|*example*|*secret*)
            echo "compose-guard: $$name contains a placeholder word; generate a random value." >&2
            fail=1 ;;
        esac
      }
      check POSTGRES_PASSWORD "$$POSTGRES_PASSWORD"
      check REDIS_PASSWORD "$$REDIS_PASSWORD"
      exit $$fail
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    restart: "no"
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:8000:8000
    # The shared app environment (x-app-environment), spelled out because a
    # merge key (<<) is not used in this file, plus sign-in for the console.
    environment:
      APP_NAME: CodeForge AI
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://codeforge:${POSTGRES_PASSWORD:-}@postgres:5432/codeforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      # Sign-in for the review console.  Unset GitHub values leave sign-in
      # unconfigured (503).  Unset JWT_SECRET_KEY keeps the API's built-in
      # development default, as before; set your own (docs/deployment.md).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-insecure-codeforge-secret-key-change-in-production-32chars}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # GitHub App (repository permission checks) and webhook verification.
      # Optional: unset keeps repository access disabled; set both App values
      # or neither (the API refuses to start otherwise).
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  # The review console: the production build of apps/web behind an
  # unprivileged nginx (apps/web/Dockerfile, nginx.conf), which serves the app,
  # falls back to index.html for client-side routes and forwards /api/ to the
  # api service over this network.  Loopback only; no secrets.
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
    - 127.0.0.1:3000:8080
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeforge
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    # Healthy only when the configured password actually logs in (an existing
    # data volume keeps the password it was created with), so the application
    # services never start against credentials that fail.  It connects via the
    # service name, not 127.0.0.1: the image's pg_hba.conf trusts loopback
    # connections without a password, but enforces scram-sha-256 on the
    # network address the application uses.
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h postgres -U codeforge -d codeforge -tAc 'select 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      compose-guard:
        condition: service_completed_successfully
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    # Enforce authentication.  The password goes into a config file readable
    # only by the redis user, never onto a command line (visible to `ps`), and
    # the image's entrypoint still drops root privileges for redis-server.
    entrypoint: ["sh", "-c"]
    command:
    - |
      umask 077
      printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
      chown redis:redis /tmp/redis.conf
      exec docker-entrypoint.sh redis-server /tmp/redis.conf
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      compose-guard:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command:
    - python
    - -m
    - app.worker
    # The shared app environment, plus the GitHub App (cloning and publishing
    # repository-scoped) and the agent's model key.  Test execution stays
    # disabled here (see docs/deployment.md).
    environment:
      APP_NAME: CodeForge AI
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://codeforge:${POSTGRES_PASSWORD:-}@postgres:5432/codeforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
  dispatcher:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command:
    - python
    - -m
    - app.outbox_dispatcher
    # The shared app environment, plus the GitHub App (check runs and comments).
    environment:
      APP_NAME: CodeForge AI
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://codeforge:${POSTGRES_PASSWORD:-}@postgres:5432/codeforge
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
volumes:
  postgres_data: null
