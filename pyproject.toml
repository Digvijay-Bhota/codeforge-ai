[tool.pytest.ini_options]
# Discover tests under apps/api/tests/
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Make `from app.*` importable without setting PYTHONPATH manually.
pythonpath = ["apps/api"]
# Exclude fixture repos (they contain intentionally broken code for agent testing).
norecursedirs = ["apps/api/tests/fixtures"]
# Custom markers
markers = [
    "integration: marks tests that require external services (e.g. OpenAI API)",
]
# Suppress collection warnings for application classes that start with 'Test'.
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, UP = pyupgrade, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false                  # Start permissive; tighten per phase
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # Avoids noise for untyped third-party packages

# Per-module overrides
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
